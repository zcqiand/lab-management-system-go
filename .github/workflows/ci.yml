name: ci

# lab-management-system-go (Go 1.27, net/http 标准库, 零三方依赖)
# 家族原则（镜像 kotlin/laravel ci.yml 注释）：CI=门内静态+test + 镜像装配冒烟；
# suite gate=全量（L0.5 deploy parity 在本地跑）。四门全工具链自带；L4 真库测试
# 由 postgres service 容器供给（kotlin ci 同形，REQ-2026-004 起测试依赖家族 PG）。
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # 本地 gate L4 同形：lab_test @ 127.0.0.1:54321，凭据 postgres/postgres（kotlin ci 镜像）
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lab_test
        ports:
          - 54321:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Schema bootstrap — shared 仓 DDL（DB-First：schema 只认 shared 生成物）
        # 0000=全量目标 DDL（幂等 IF NOT EXISTS）+ 0001 增量；uuid_generate_v4 依赖
        # uuid-ossp 扩展（本地 pgdata 已带、runner 全新库须显式建）。本地空库复演过
        # （24 表 + go test ./... 全绿）。
        run: |
          base="https://raw.githubusercontent.com/zcqiand/lab-management-system-shared/refs/heads/master/drizzle"
          { echo 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
            curl -fsSL "$base/0000_target_ddl.sql"
            curl -fsSL "$base/0001_early_quasimodo.sql"
          } | psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54321/lab_test

      - name: L1/L2/L4 — gofmt + vet + build + test
        env:
          # testsupport 优先吃进程 env；与 .env.test 严格同值，防测试吃环境漂移
          SERVER_PORT: "5211"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54321/lab_test
        run: |
          gofmt -l cmd internal | tee /tmp/fmt.out
          [ ! -s /tmp/fmt.out ] || { echo "ERROR: gofmt 未格式化文件:" >&2; exit 1; }
          go vet ./...
          go build ./...
          go test ./...

      - name: 镜像装配冒烟 — build + run + /health 200
        # prod 同款镜像直接拉起（连 Dockerfile 一起验）。REQ-2026-004 起装配期
        # fail-fast 全键（SERVER_PORT/DATABASE_URL/LAB_SAAS_* 五键）且 gorm.Open
        # 急连 DB——--network host 让容器 127.0.0.1:54321 打进 service PG；LAB_SAAS_*
        # 显式占位值（/health 不触 IdP，suite 硬规则 §1 禁缺键）。
        run: |
          docker build -t go-smoke .
          docker rm -f go-smoke >/dev/null 2>&1 || true
          docker run -d --name go-smoke --network host \
            --env SERVER_PORT=5211 \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54321/lab_test \
            --env LAB_SAAS_BASE_URL=http://127.0.0.1:5101 \
            --env LAB_SAAS_CLIENT_ID=lab-management \
            --env LAB_SAAS_CLIENT_SECRET=smoke-placeholder \
            --env LAB_SAAS_DEFAULT_TENANT_ID=00000000-0000-0000-0000-000000000000 \
            --env LAB_SAAS_SERVICE_CLIENT_ID=lab-management-service \
            --env LAB_CORS_ALLOWED_ORIGINS=http://localhost:5201 \
            go-smoke
          ok=""
          for i in $(seq 1 60); do
            body="$(curl -fsS --max-time 3 http://127.0.0.1:5211/health 2>/dev/null || true)"
            if [ -n "$body" ]; then
              echo "→ /health: $body"
              echo "$body" | grep -q '"ok":true' && ok=1 && break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "ERROR: go smoke /health 未 200（60s 上限），容器日志:" >&2
            docker logs go-smoke 2>&1 | tail -40 >&2
            docker rm -f go-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          # 405 守卫（REQ-2026-001 形态）：POST /health 拒绝
          code="$(curl -fsS -o /dev/null -w '%{http_code}' -X POST --max-time 3 http://127.0.0.1:5211/health 2>/dev/null || true)"
          echo "→ POST /health: $code"
          if [ "$code" != "405" ]; then
            echo "ERROR: POST /health 非 405" >&2
            docker rm -f go-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          # Swagger 文档面（rails routes.rb /api-docs 同款基础设施；ktor CI 冒烟同款）
          docs="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:5211/api-docs 2>/dev/null || true)"
          echo "→ GET /api-docs: $docs"
          if [ "$docs" != "302" ]; then
            echo "ERROR: GET /api-docs 非 302" >&2
            docker rm -f go-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          docker rm -f go-smoke >/dev/null 2>&1 || true

  # 部署链（lab X13=5211；镜像 kotlin deploy job，tag push 触发）:
  #   docker build & push（latest + tag 双份）→ VPS deploy 脚本拉镜像 + 渲染 nginx vhost
  #   + 起容器 + /health 探活。本仓 env 契约只有 SERVER_PORT（无 secret），
  #   go.env 由 deploy 脚本自举 14 key（REQ-2026-004）——secret 类走 envs 转发。
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@v1
        # appleboy/ssh-action@v1 的 ${{ secrets.* }} 不会自动进 SSH 远端 shell;
        # step env 注入 Actions env,with.envs 列出要转发的名字 (逗号分隔)。
        env:
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          LAB_SAAS_CLIENT_SECRET: ${{ secrets.LAB_SAAS_CLIENT_SECRET }}
          LAB_SAAS_DEFAULT_TENANT_ID: ${{ secrets.LAB_SAAS_DEFAULT_TENANT_ID }}
          LAB_SAAS_SERVICE_USER: ${{ secrets.LAB_SAAS_SERVICE_USER }}
          LAB_SAAS_SERVICE_PASSWORD: ${{ secrets.LAB_SAAS_SERVICE_PASSWORD }}
          NGINX_DOMAIN: ${{ vars.NGINX_DOMAIN }}
          NGINX_CERT_BASENAME: ${{ vars.NGINX_CERT_BASENAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PG_HOST,PG_PASSWORD,JWT_SIGNING_KEY,LAB_SAAS_CLIENT_SECRET,LAB_SAAS_DEFAULT_TENANT_ID,LAB_SAAS_SERVICE_USER,LAB_SAAS_SERVICE_PASSWORD,NGINX_DOMAIN,NGINX_CERT_BASENAME
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 拉 deploy 脚本
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            # 总是重拉最新 deploy 脚本（脚本 bug fix 立即生效）；nginx 模板由脚本自拉
            curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/${REPO}.sh" -o "$REPO.sh"
            chmod +x "$REPO.sh"
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"
